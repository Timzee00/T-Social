name: Validate T Social
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: t_social_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:test-only@127.0.0.1:3306/t_social_test
      PUBLIC_APP_URL: http://localhost:3000
      S3_BUCKET: t-social-test
      S3_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: test-only
      S3_SECRET_ACCESS_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run check && npm run lint && npm run format:check && npm run check:secrets
      - run: npm test && npm run build
      - run: npm audit --omit=dev
      - run: npm run db:migrate && npm run test:integration
      - run: npm run test:production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            qa-results/
